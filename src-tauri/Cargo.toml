[package]
name = "controller-server-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "controller_server_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ['tray-icon'] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winapi = { version = "0.3", features = ["setupapi", "hidsdi", "fileapi", "winioctl", "errhandlingapi", "handleapi", "ioapiset", "winuser"] }
windows = { version = "0.58", features = [ "Win32", "Win32_Devices", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System", "Win32_System_IO", "Win32_Storage", "Win32_Storage_FileSystem" ] }
rayon = "1.5"
lazy_static = "1.4"
local-ip-address = "=0.6.3"
